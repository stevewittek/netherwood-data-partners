name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix backend
      - name: Lint
        run: pnpm run lint
      - name: Marketing tests and strict typecheck
        run: |
          pnpm test:marketing
          pnpm typecheck:marketing
      - name: Publication tests
        run: pnpm test:publication
      - name: Migration and attribution tests
        run: pnpm test:migration
      - name: Test
        run: pnpm run test
      - name: Build static site
        run: |
          pnpm run build:pages
          node scripts/check-pages.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  backend-windows:
    name: Backend Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  marketing-windows:
    name: Marketing Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Marketing tests
        run: node --experimental-strip-types --test marketing/test/*.test.ts
