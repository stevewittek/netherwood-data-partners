services:
  api:
    build: { context: . }
    env_file:
      - path: .env.local
        required: false
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      KNOWLEDGE_ROOT: /knowledge
      SQL_SERVER_HOST: localhost
      SQL_SERVER_PORT: 1433
    init: true
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ../company-knowledge/public:/knowledge:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: 1
    init: true
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 5g
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  articles-export:
    profiles: ["tools"]
    build: { context: . }
    env_file:
      - path: .env.local
        required: true
    environment:
      SQL_SERVER_HOST: localhost
      SQL_SERVER_PORT: 1433
    init: true
    network_mode: host
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ../pages-site:/export
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["node", "--experimental-strip-types", "src/export-articles.ts", "/export/.publication-candidates/articles-snapshot.candidate.json", "/export/articles-snapshot.json"]

  articles-review:
    profiles: ["tools"]
    build: { context: . }
    init: true
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ../pages-site:/export
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["node", "--experimental-strip-types", "src/review-article-snapshot.ts", "/export/.publication-candidates/articles-snapshot.candidate.json", "/export/articles-snapshot.json"]

volumes:
  ollama_data:
